<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Appointment Desk cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag">Words from a real test run</span>
  <div class="stage">
    <div>
      <p class="who">Patient asks the clinic chat</p>
      <p class="msg">Please book an initial assessment on Monday 5 October at 11:00.</p>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="tick"></span>Assistant replies</p>
      <p class="big long">Booked: Monday<br>5 October, 11:00</p>
      <p class="sub">Slot checked, booked into Google Calendar and logged.</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Ask</li><li class="sep"></li>
    <li class="done">Check the calendar</li><li class="sep"></li>
    <li class="on">Booked</li>
  </ol>
</div>
</body>
</html>
