<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <meta name="color-scheme" content="light" />

    <!-- Everything in %…% below is written at build time by the siteMeta
         plugin in vite.config.js, from `site` and `seo` in src/data.js.
         Change the domain, title or description there, not here. -->
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="author" content="Aniket" />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="%SITE_ORIGIN%/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aniket" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="en_IN" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%SEO_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%OG_TITLE%" />
    <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />

    <script type="application/ld+json">%JSON_LD%</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
