<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AI service cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag is-schematic">Illustration · how it works</span>
  <div class="stage">
    <div>
      <p class="who">A customer asks, late at night</p>
      <p class="msg">Do you have a slot on Tuesday evening?</p>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="tick"></span>AI replies</p>
      <p class="big long">Tuesday 18:30<br>is free. Book it?</p>
      <p class="approve"><span class="person"></span>You check what matters</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Ask</li><li class="sep"></li>
    <li class="done">AI answers</li><li class="sep"></li>
    <li class="on person-step"><span class="person"></span>A person checks</li>
  </ol>
</div>
</body>
</html>
