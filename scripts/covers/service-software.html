<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Software service cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag is-schematic">Illustration · how it works</span>
  <div class="stage">
    <div class="scatter">
      <span class="chip">Three spreadsheets</span>
      <span class="chip">WhatsApp threads</span>
      <span class="chip">Paper forms</span>
    </div>
    <span class="arrow"></span>
    <div class="panel lit system">
      <p class="head-row"><span>One system</span><span class="chip on">Yours to keep</span></p>
      <div class="rows">
        <p class="row"><span>Clients</span><span>one record each</span></p>
        <p class="row"><span>Bookings</span><span>one calendar</span></p>
        <p class="row"><span>Payments</span><span>in the same place</span></p>
      </div>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Scattered</li><li class="sep"></li>
    <li class="done">One record</li><li class="sep"></li>
    <li class="on">Each person sees their part</li>
  </ol>
</div>
</body>
</html>
