<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lead Research Tool cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag">Drawn from the working demo</span>
  <div class="stage">
    <div>
      <p class="who">Paste a website</p>
      <p class="msg url">www.dnco.com</p>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="tick"></span>A scored lead</p>
      <p class="big">DNCO</p>
      <p class="sub" style="margin-top:6px">mail@dnco.com</p>
      <div class="score"><span class="bar"><i style="width:90%"></i></span><span class="n">90</span><span class="of">/ 100</span></div>
      <p class="sub" style="margin-top:8px;font-size:16px">Scored by how easy it is to reach</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Paste</li><li class="sep"></li>
    <li class="done">Read the site</li><li class="sep"></li>
    <li class="on">Score and download</li>
  </ol>
</div>
</body>
</html>
