<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Practice Knowledge Assistant cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag">Words from a real test run</span>
  <div class="stage">
    <div>
      <p class="who">Patient asks</p>
      <p class="msg">How much is a 45-minute session?</p>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="tick"></span>Answered from its documents</p>
      <div class="rows">
        <p class="row"><span>Follow-up session</span><span>₹900</span></p>
        <p class="row"><span>Sports injury rehab</span><span>₹1,300</span></p>
        <p class="row"><span>Ergonomic review</span><span>₹1,000</span></p>
      </div>
      <p style="margin-top:18px"><span class="chip on">Source: Services Table</span></p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Ask</li><li class="sep"></li>
    <li class="done">Search the documents</li><li class="sep"></li>
    <li class="on">Answer, source named</li>
  </ol>
</div>
</body>
</html>
