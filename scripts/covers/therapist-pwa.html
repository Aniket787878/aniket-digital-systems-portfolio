<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Clinic Staff App cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag is-schematic">Illustration · no client data</span>
  <div class="stage">
    <div class="rec">
      <p class="who">Session recorded</p>
      <div class="wave"><i style="height:30%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:55%"></i><i style="height:80%"></i><i style="height:35%"></i><i style="height:65%"></i><i style="height:40%"></i><i style="height:75%"></i><i style="height:50%"></i></div>
    </div>
    <span class="arrow"></span>
    <div class="panel lit note">
      <p class="head-row"><span>Draft session note</span><span class="chip">Not saved yet</span></p>
      <p class="sec">Presenting concerns</p><div class="lines"><i style="width:90%"></i><i style="width:64%"></i></div>
      <p class="sec">Session content</p><div class="lines"><i style="width:82%"></i></div>
      <p class="sec">Interventions</p><div class="lines"><i style="width:70%"></i></div>
      <p class="approve"><span class="person"></span>The therapist approves</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Record</li><li class="sep"></li>
    <li class="done">AI drafts</li><li class="sep"></li>
    <li class="on person-step"><span class="person"></span>Therapist decides</li>
  </ol>
</div>
</body>
</html>
