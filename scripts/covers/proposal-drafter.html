<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Proposal Drafter cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag is-demo">Demo · made-up business</span>
  <div class="stage">
    <div class="panel quote">
      <p class="who">Priced from the rate card</p>
      <div class="rows">
        <p class="row dim"><span>Brand identity</span><span>₹85,000</span></p>
        <p class="row dim"><span>Website, 5 pages</span><span>₹1,20,000</span></p>
        <p class="row total"><span>Total</span><span>₹2,90,280</span></p>
      </div>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="person"></span>The owner decides</p>
      <p class="big long">Nothing is sent until the owner approves.</p>
      <p class="choices"><span class="chip on">Approve and send</span><span class="chip">Do not send</span></p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Brief</li><li class="sep"></li>
    <li class="done">Draft and price</li><li class="sep"></li>
    <li class="on person-step"><span class="person"></span>Owner approves</li>
  </ol>
</div>
</body>
</html>
