<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Care Journey Platform cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag is-schematic">Illustration · no client data</span>
  <div class="stage">
    <div class="panel checks">
      <p class="who">Before anyone can pay</p>
      <p class="ck"><span class="tk"></span>Screening call held</p>
      <p class="ck"><span class="tk"></span>History and risk reviewed</p>
      <p class="ck"><span class="tk"></span>Program fit discussed</p>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="person"></span>A clinician checks</p>
      <p class="big long">Nobody pays until a clinician says yes.</p>
      <p class="sub">Then payment, and the 12-week portal opens.</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Enquire</li><li class="sep"></li>
    <li class="on person-step"><span class="person"></span>Clinician says yes</li><li class="sep"></li>
    <li>Pay and enrol</li>
  </ol>
</div>
</body>
</html>
