<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Enquiry Rescue cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag is-demo">Demo · made-up business</span>
  <div class="stage">
    <div>
      <p class="who">Buyer writes at 21:40</p>
      <p class="msg">Hi, saw your ad for 2BHK in Baner. Price?</p>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="tick"></span>Answered and booked</p>
      <p class="big long">Site visit booked: Sunday, 11:00</p>
      <p class="sub">After the office has closed. Price talks go to a sales person.</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Answer</li><li class="sep"></li>
    <li class="done">Book a visit</li><li class="sep"></li>
    <li class="on person-step"><span class="person"></span>A person calls</li>
  </ol>
</div>
</body>
</html>
