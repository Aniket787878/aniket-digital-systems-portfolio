<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Consent and Contract Signer cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag">Drawn from the working demo</span>
  <div class="stage">
    <div class="panel doc">
      <p class="who">Signed on a phone</p>
      <p class="doc-title">Informed Consent for Treatment</p>
      <div class="lines"><i style="width:92%"></i><i style="width:84%"></i><i style="width:60%"></i></div>
      <p class="signed"><span>Priya Sharma</span><span class="dim">Signed</span></p>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="tick"></span>Public check page</p>
      <p class="big">Authentic,<br>seal intact</p>
      <p class="sub">The record is unchanged since it was completed.</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Sign</li><li class="sep"></li>
    <li class="done">Seal</li><li class="sep"></li>
    <li class="on">Anyone can check</li>
  </ol>
</div>
</body>
</html>
