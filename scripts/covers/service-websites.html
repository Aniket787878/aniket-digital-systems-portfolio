<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Websites service cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag is-schematic">Illustration · how it works</span>
  <div class="stage">
    <div class="panel form site-card">
      <p class="who">Your website</p>
      <p class="site-head">Book a first visit</p>
      <p class="field">Your phone number</p>
      <p class="send">Send</p>
    </div>
    <span class="arrow"></span>
    <div class="panel lit result">
      <p class="head"><span class="tick"></span>The moment it is sent</p>
      <p class="big long">In your inbox<br>and on WhatsApp</p>
      <p class="sub">And the visitor gets a reply straight away.</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Visit</li><li class="sep"></li>
    <li class="done">Enquire</li><li class="sep"></li>
    <li class="on">Reply sent</li>
  </ol>
</div>
</body>
</html>
