<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Website Answer Widget cover</title><link rel="stylesheet" href="covers.css"></head>
<body>
<div class="cover">
  <span class="tag">Words from a real test run</span>
  <div class="stage site">
    <div class="page">
      <p class="page-kicker">Demo Physio Clinic</p>
      <p class="page-head">Movement, without the guesswork.</p>
      <div class="lines"><i style="width:88%"></i><i style="width:72%"></i><i style="width:80%"></i></div>
    </div>
    <div class="panel lit widget">
      <p class="who">Visitor asks on the website</p>
      <p class="msg">Do you offer acupuncture?</p>
      <p class="reply">I don't know, please ask the front desk.</p>
      <p class="callback"><span class="person"></span>Thanks, the front desk will call you.</p>
    </div>
  </div>
  <ol class="flow">
    <li class="done">Ask</li><li class="sep"></li>
    <li class="done">Not in the documents</li><li class="sep"></li>
    <li class="on">Callback taken</li>
  </ol>
</div>
</body>
</html>
